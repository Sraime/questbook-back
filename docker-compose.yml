# Production stack for the OVH VPS.
#
# Only Caddy publishes ports: the API and PostgreSQL stay on the internal
# Docker network, so the firewall only ever needs 80/443 open (plus SSH).

# La politique de confidentialité annonce des journaux gardés dans un tampon
# glissant. Sans cette rotation, le pilote par défaut les garde tant que le
# conteneur vit — et Caddy, lui, tourne des semaines d'affilée : la promesse
# serait fausse, et les journaux d'adresses IP sans fin.
x-journaux: &journaux
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *journaux
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No `ports:` on purpose: the volume holds emails and display names, so
    # PostgreSQL must stay on the internal Docker network.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    logging: *journaux
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Le backoffice. Meme image que l'API, meme base, autre processus.
  admin:
    build: .
    restart: unless-stopped
    logging: *journaux
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    # C'est cette ligne, et elle seule, qui ferme le backoffice au monde. Un
    # `4000:4000` nu publierait sur toutes les interfaces en ecrivant
    # directement dans netfilter, donc sans que UFW ne l'indique nulle part.
    # On y accede par un tunnel : ssh -L 4000:127.0.0.1:4000 -p 2222 <vps>
    ports:
      - '127.0.0.1:4000:4000'
    # Pas le point d'entree par defaut : lui applique les migrations, et deux
    # conteneurs qui les appliquent au meme demarrage se disputent le verrou
    # de Prisma. `depends_on: api` garantit qu'elles sont deja passees.
    entrypoint: ['node']
    command: ['dist/admin.js']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *journaux
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
